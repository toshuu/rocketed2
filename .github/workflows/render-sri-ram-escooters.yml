name: Render Sri Ram eScooters December reel
on:
  push:
    branches: [master]
    paths:
      - "videos/sri-ram-escooters/**"
      - ".github/workflows/render-sri-ram-escooters.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify render environment
        run: |
          node --version
          ffmpeg -version
          npx --yes hyperframes doctor
      - name: Lint composition
        working-directory: videos/sri-ram-escooters
        run: npx --yes hyperframes lint
      - name: Render MP4
        working-directory: videos/sri-ram-escooters
        run: npx --yes hyperframes render --output sri-ram-escooters-december.mp4 --fps 30 --quality standard
      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: sri-ram-escooters-december-reel
          path: videos/sri-ram-escooters/sri-ram-escooters-december.mp4
          if-no-files-found: error
          retention-days: 14
